# hide's yazi config — used only when yazi runs as the hide file picker
# (hide-open sets YAZI_CONFIG_HOME to this dir). We want a picker, not a previewer:
# yazi's default image/file previews spawn the terminal graphics protocol, which
# corrupts/crashes a tmux popup. Route every file to the built-in `noop` previewer
# and preloader so nothing ever tries to draw graphics.
[plugin]
prepend_previewers = [
    { mime = "*/*", run = "noop" },
]
prepend_preloaders = [
    { mime = "*/*", run = "noop" },
]
