# hide — tmux config for the Helix IDE. Minimal, owned. No plugins.
set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"          # truecolor
set -g  allow-passthrough on                 # let yazi & co round-trip terminal queries through tmux
set -g  mouse on
set -s  escape-time 10
set -g  base-index 0
setw -g pane-base-index 0
set -g  renumber-windows on

# Pane labels (editor / agent / terminal) + a minimal project bar (active project = session).
set -g allow-rename off
setw -g automatic-rename off
set -g pane-border-status top
set -g pane-border-format " #{?@role,#{@role},#{pane_title}} "
# Heavy box-drawing lines so hide's pane borders stand apart from Helix's thin buffer splits.
set -g pane-border-lines heavy
set -g status on
# Project tabs: open hide projects as a browser-style strip (current one bracketed).
set -g status-left-length 200
set -g status-left  "#[fg=brightblack] hide #[default]#(hide-tabs #S)"
set -g status-right ""
set -g status-justify left
set -g status-interval 5
# Hide the window list so off-screen holding windows (_h_*) never show.
set -g window-status-format ""
set -g window-status-current-format ""

# Normalize the layout once when the first real client attaches (agent 30%, terminal sliver).
set-hook -g client-attached 'run-shell "HIDE_SESSION=#{session_name} HIDE_SOCKET=hide hide-init"'

# --- hide keybinds (no prefix). Consistent scheme:
#   Space = show/hide · Y = focus  |  Ctrl = agent · Alt = terminal
# (Ctrl+Shift+* needs the kitty/extended-keys protocol, which thrashes as focus moves between
#  panes whose apps do/don't use it — unreliable. Ctrl and Alt both transmit as plain sequences.)
bind -n C-Space run-shell "HIDE_SESSION=#{session_name} hide-toggle agent"
bind -n M-Space run-shell "HIDE_SESSION=#{session_name} hide-toggle terminal"
bind -n C-y     run-shell "HIDE_SESSION=#{session_name} HIDE_ACTIVE=#{@role} hide-focus agent"
bind -n M-y     run-shell "HIDE_SESSION=#{session_name} HIDE_ACTIVE=#{@role} hide-focus terminal"
# --- Power tools (Ctrl+Alt namespace — free in Helix, can't clobber its keymap).
# Floating popups rooted at the project root (@hide_root, set by the launcher).
bind -n C-M-g display-popup -E -w 90% -h 90% -d "#{@hide_root}" -T " lazygit " "lazygit"
bind -n C-M-o new-window -n open   -c "#{@hide_root}" "HIDE_OPEN_MODE=open hide-open"
bind -n C-M-v new-window -n vsplit -c "#{@hide_root}" "HIDE_OPEN_MODE=vsplit hide-open"
bind -n C-M-f display-popup -E -w 90% -h 85% -d "#{@hide_root}" -T " search " "hide-search"
# Project-wide search & replace (serpl). Writes to disk, then reloads Helix buffers.
bind -n C-M-r display-popup -E -w 90% -h 90% -d "#{@hide_root}" -T " search & replace " "hide-replace"
# Switch between open hide projects (each is its own session). Picker popup, sesh-style but owned.
bind -n C-M-w display-popup -E -w 50% -h 50% -T " switch project " "HIDE_SESSION=#{session_name} hide-switch"
# Kill the whole hide session (clean teardown — Codex + terminal die with it).
# Confirm first so a fat-fingered Ctrl+Alt+Q can't nuke a session by accident.
bind -n C-M-q confirm-before -p "kill hide session '#S'? (y/n) " kill-session
# Pane navigation (Alt + hjkl).
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
