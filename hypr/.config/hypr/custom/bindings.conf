# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

unbind = SUPER SHIFT, G
bindd = SUPER SHIFT, G, Matrix, exec, omarchy-launch-or-focus-webapp "matrix.tuwien" "https://matrix.tuwien.ac.at"

unbind = SUPER SHIFT, E
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-or-focus-webapp "mail.tuwien" "https://mail.tuwien.ac.at"

bindd = SUPER SHIFT ALT, E, Gmail, exec, omarchy-launch-or-focus-webapp "gmail.com" "https://gmail.com"

unbind = SUPER SHIFT, M
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus-webapp "YouTube Music" "https://music.youtube.com/"

unbind = SUPER SHIFT, RETURN
bind = SUPER SHIFT, RETURN, exec, ghostty -e ssh hana@quartz

bindd = SUPER SHIFT, Q, Atrium, exec, omarchy-launch-or-focus-webapp "quartz.tailc1be0d" "https://quartz.tailc1be0d.ts.net/"

unbind = SUPER SHIFT, A
bindd = SUPER SHIFT, A, Claude, exec, omarchy-launch-or-focus-webapp "claude.com" "https://claude.com"

unbind = SUPER SHIFT ALT, A
bindd = SUPER SHIFT ALT, A, ChatGPT, exec, omarchy-launch-or-focus-webapp "chatgpt.com" "https://chatgpt.com"

# Add extra bindings

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Logitech MX Keys
# bind = SUPER SHIFT, S, exec, omarchy-capture-screenshot      # Print Screen Button
# bind = SUPER, PERIOD, exec, omarchy-launch-walker -m symbols # Emoji Button

# Voxtype push-to-talk on the Menu key (between AltGr and Right Ctrl).
# Replaces Omarchy's default F9 push-to-talk pair.
unbind = , F9
bind  = , Menu, exec, voxtype record start
bindr = , Menu, exec, voxtype record stop
